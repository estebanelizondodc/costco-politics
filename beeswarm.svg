  <text class="cls-13" transform="translate(16.44 369.48)"><tspan x="0" y="0">Note: </tspan><tspan class="cls-19" x="32.02" y="0">V</tspan><tspan x="39.13" y="0">alues represent the change in a county&apos;s presidential voting margin between 2000 and 2024, not the final election result. Ex: D+5 indicates the </tspan><tspan x="0" y="14.4">county shifted five percentage points toward Democrats over that period.</tspan></text>
  <text class="cls-14" transform="translate(6.2 15.48)"><tspan x="0" y="0">The Politics of Costco Country</tspan></text>
  <text class="cls-11" transform="translate(13.97 32.36)"><tspan x="0" y="0">Each circle represents a county where Costco opened a warehouse between 2000 and 2020. </tspan><tspan x="0" y="10.8">Position and color show the county</tspan><tspan class="cls-20" x="139.08" y="10.8">’</tspan><tspan x="140.92" y="10.8">s shift in presidential margin from 2000 to 2024. </tspan><tspan x="0" y="21.6">Circle size represents the magnitude of population change from 2000 to 2020.</tspan></text>
  <line class="cls-3" x1="517.57" y1="325.19" x2="517.57" y2="64.54"/>
  <text class="cls-11" transform="translate(759.02 173.24)"><tspan x="0" y="0">Ocean, NJ</tspan></text>
